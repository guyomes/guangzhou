<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="tower" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="river" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Background Circle (Safe zone) -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />

  <!-- Subtle pearl river flow waves -->
  <path d="M40 390 C 150 360, 240 430, 360 380 C 420 355, 460 370, 480 380 L 480 440 C 440 450, 340 420, 250 450 C 140 480, 70 430, 40 440 Z" fill="url(#river)" />

  <!-- Canton Tower Stylized Silhouette -->
  <!-- Spire -->
  <line x1="256" y1="60" x2="256" y2="120" stroke="#f43f5e" stroke-width="6" stroke-linecap="round" />
  <circle cx="256" cy="60" r="5" fill="#f43f5e" />

  <!-- Hyperboloid lattice body -->
  <path d="M 216 130 Q 256 240 242 370 L 270 370 Q 256 240 296 130 Z" fill="url(#tower)" />
  
  <!-- Modern structural rings -->
  <ellipse cx="256" cy="150" rx="36" ry="6" fill="none" stroke="#fed7aa" stroke-width="3" />
  <ellipse cx="256" cy="200" rx="26" ry="5" fill="none" stroke="#fbcfe8" stroke-width="2.5" />
  <ellipse cx="256" cy="245" rx="16" ry="3.5" fill="none" stroke="#bae6fd" stroke-width="3" />
  <ellipse cx="256" cy="290" rx="20" ry="4" fill="none" stroke="#fed7aa" stroke-width="2.5" />
  <ellipse cx="256" cy="340" rx="28" ry="5.5" fill="none" stroke="#fed7aa" stroke-width="3" />

  <!-- Lingnan Roof Eaves Crest (subtle heritage fusion) -->
  <path d="M 170 375 Q 210 365 256 368 Q 302 365 342 375 C 330 385 320 385 256 383 C 192 385 182 385 170 375 Z" fill="#fb7185" />

  <!-- French Flag Ribbon Accent Dot / Compass Star -->
  <circle cx="256" cy="245" r="4" fill="#ffffff" />
  
  <!-- Subtle typography label -->
  <text x="256" y="475" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="28" fill="#e2e8f0" text-anchor="middle" letter-spacing="4">GUANGZHOU</text>
</svg>
